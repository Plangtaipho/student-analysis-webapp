<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>{% block title %}รายงาน{% endblock %}</title>
<style>
  @font-face { font-family: "Sarabun"; src: url("{{ font_dir }}/Sarabun-Regular.ttf"); font-weight: normal; }
  @font-face { font-family: "Sarabun"; src: url("{{ font_dir }}/Sarabun-Bold.ttf"); font-weight: bold; }
  @page { size: A4; margin: 1.3cm 1.5cm 1.2cm 2cm; }
  body { font-family: "Sarabun"; font-size: 12.5pt; line-height: 1.32; color: #000; }
  h1 { font-size: 16pt; text-align: center; margin: 0 0 8pt; }
  h2 { font-size: 14pt; margin: 10pt 0 4pt; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  .fill { border-bottom: 1px dotted #444; padding: 0 4pt; min-width: 40pt; display: inline-block; }
  .row { margin: 1pt 0; }
  .muted { color: #444; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border: 1px solid #000; padding: 1pt 4pt; vertical-align: top; }
  th { font-weight: bold; text-align: center; }
  .c { text-align: center; }
  .domain td { font-weight: bold; }
  .noborder td { border: none; padding: 1pt 4pt; }
  .right { text-align: right; }
  .sign { margin-top: 10pt; margin-left: 50%; text-align: center; }
  {% block style %}{% endblock %}
</style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
